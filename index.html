<!doctype html>
<html lang="es-AR" data-skin="%SKIN_ID%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="%SKIN_BG%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- La fuente de la marca (títulos, logo, medallas y celebraciones). Los valores entre % los completa vite.config.ts con la marca del skin. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="%SKIN_FONT_HREF%" />
    <meta name="description" content="%SKIN_DESCRIPTION%" />
    <title>%SKIN_NAME%</title>
    <style>
      /* Pantalla de inicio mientras baja la app; main.tsx la saca cuando React ya dibujó. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: %SKIN_BG%;
        color: %SKIN_TEXT%;
        font: 400 32px '%SKIN_FONT%', system-ui, sans-serif;
        transition: opacity 0.25s ease;
      }
      #splash img {
        width: 120px;
        height: 120px;
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <!-- Con "reducir movimiento", el logo quieto (SMIL no se puede pausar desde CSS). -->
      <picture>
        <source media="(prefers-reduced-motion: reduce)" srcset="./favicon.svg" />
        <img src="./logo-secuencia.svg" alt="" />
      </picture>
      %SKIN_NAME%
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
